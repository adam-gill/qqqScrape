services:
  agqqq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agqqq
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/cache.db
    volumes:
      # Persist the SQLite database using named volume
      - agqqq_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 600s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits - enough for Puppeteer but won't hog resources
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  agqqq_data:
    driver: local
